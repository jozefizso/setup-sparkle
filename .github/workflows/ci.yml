name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: [ ubuntu-latest ]

    steps:
    - name: checkout
      uses: actions/checkout@v5

    - name: setup node
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc

    - name: npm ci
      run: npm ci

    - name: npm audit
      run: npm audit
